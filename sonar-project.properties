# SonarCloud project settings for this repository
sonar.projectKey=tech-challenge-pos-fiap_notification-service
sonar.projectName=processing-worker-service
sonar.organization=tech-challenge-pos-fiap
sonar.branch.name=main

# Source and tests
sonar.sources=app
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Python
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8

# Coverage generated by pytest --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml

# Optional exclusions
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/venv/**
sonar.coverage.exclusions=tests/**,**/__init__.py